  - >
    Book contribution: supplies the vocabulary and experimental
    distinctions required for later claims about hidden state, history
    dependence, causal availability, and memory.
  - >
    Placement: prerequisite for Chapters 9 and 15; moving it later
    would make those chapters conceptually under-specified.
  - >
    MRI calibration: required beats are intentionally atomic and
    section-shaped. A beat should normally be satisfiable by one
    section or one tightly adjacent section pair rather than by evidence
    distributed across the full chapter.
  - >
    Experimental Note is supporting/reference material and should not
    be preferred over the prose section in which a structural move is
    actually performed.