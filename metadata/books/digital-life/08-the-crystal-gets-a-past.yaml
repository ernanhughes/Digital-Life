  -> causal pulse intervention
  -> timing controls
  -> sender and chronology controls
  -> connectivity without coordination
  -> stochastic-coupling correction
  -> matched-history test
  -> different particular futures without stable tested signature
  -> bounded hierarchy
  -> internal-carrier question

