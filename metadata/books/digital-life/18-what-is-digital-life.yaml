concept_targets:
- process continuity
- active interface
- finite computational opportunity
- hidden-state causality
- causal containment
- negative specification
- organizational self-conditioning
- process-first hypothesis
claim_targets:
- The Digital Crystal being alive is not established.
- Useful causal organization became measurable in this substrate before a privileged
  individual boundary did.
- The surviving results motivate organized causal consequence through continued change
  as a research foundation, not a definition of life.
- Organizational self-conditioning is a speculative next discriminator and was not
  established by this book.
evidence_targets:
- Cross-chapter synthesis restricted to experimentally survived claims.
- Counterexamples using ordinary stateful computational systems.
- Explicit separation of Outlier reproduction from Digital Crystal process findings.
scope_boundaries:
- The synthesis is drawn from one main experimental substrate plus the separate Outlier
  result.
- The proposed process-first foundation is broader than life and is not sufficient.
- Organizational self-conditioning is a research hypothesis, not a finding.
- No universal claim is made that life does not require memory, individuality, metabolism,
  reproduction, or other biological properties.
reader_state: 'The reader should finish with a narrower, more operational research
  program: begin from persistent causal process and ask whether its own organization
  helps preserve the conditions of its continuation beyond matched ordinary persistence.'
technical_progression: refuse life verdict -> collect survivors -> process-before-organism
