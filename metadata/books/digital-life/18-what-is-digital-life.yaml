evidence_targets:
- Cross-chapter synthesis restricted to experimentally survived claims.
- Counterexamples using ordinary stateful computational systems.
- Explicit separation of Outlier reproduction from Digital Crystal process findings.
scope_boundaries:
- The synthesis is drawn from one main experimental substrate plus the separate Outlier result.
- The proposed process-first foundation is broader than life and is not sufficient.
- Organizational self-conditioning is a research hypothesis, not a finding.
- No universal claim is made that life does not require memory, individuality, metabolism,
  reproduction, or other biological properties.
reader_state:
  leaves_with: 'The reader should finish with a narrower, more operational research program:
    begin from persistent causal process and ask whether its own organization helps preserve
    the conditions of its continuation beyond matched ordinary persistence.'
