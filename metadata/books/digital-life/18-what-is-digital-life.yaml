  fulfilled: true
  description: Refuse the tempting final verdict that the Digital Crystal is alive.
- id: m02
  fulfilled: true
  description: Return to the starting biological nouns and replace them with earned lower-level
    relationships.
- id: m03
  fulfilled: true
  description: Synthesize continuation through material turnover as a survivor without fixed
