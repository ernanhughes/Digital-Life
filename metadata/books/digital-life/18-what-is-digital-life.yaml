chapter_mode: synthesis
purpose: Synthesize the experimentally surviving process-level relationships without
  declaring the Digital Crystal alive, distinguish substrate affordances from findings,
  propose a process-first research hypothesis, attack it with ordinary computational
  counterexamples, and identify organizational self-conditioning as the next unestablished
  discriminator to test.
