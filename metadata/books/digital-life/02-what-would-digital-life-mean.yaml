document_id: 02-what-would-digital-life-mean
document_type: chapter
title: What Would Digital Life Mean?
profile: technical
metadata_status: working
metadata_version: 2
metadata_confidence: 0.95
chapter_mode: conceptual
purpose: 'Define the research problem without importing biological categories as implementation
  requirements: life-like properties must be earned by measurable behaviour rather than names,
  while biology remains evidence about possibilities rather than a specification.'
required_beats:
- id: m01
  fulfilled: true
  description: Introduce digital life as a question about earned computational properties
    rather than a label attached in advance.
- id: m02
  fulfilled: true
  description: Expose the cargo-cult error of implementing biological nouns and treating their
    names as evidence.
- id: m03
  fulfilled: true
  description: Expose the opposite error of requiring digital systems to solve biological
    problems by biological means.
- id: m04
  fulfilled: true
  description: Reframe biology as evidence about possible organizations rather than a specification
    for implementation.
- id: m05
  fulfilled: true
  description: Reject visual aliveness as a reliable guide to mechanism or claim strength.
- id: m06
  fulfilled: true
  description: Establish that even basic nouns such as object, organism, individual, and memory
    must be operationally earned.
- id: m07
  fulfilled: true
  description: Define the book's method as starting from weak systems, testing tempting interpretations,
    and preserving only what survives controls.
- id: m08
  fulfilled: true
  description: Prepare the reader for wrong hypotheses as productive instruments rather than
    embarrassments.
- id: m09
  fulfilled: true
  description: State the actual question as what increasingly strong life-like properties
    can be constructed and justified from first principles.
- id: m10
  fulfilled: true
  description: 'Motivate the opening move: start with appearance because appearance is the
    first trap to dismantle.'
concept_targets:
- cargo-cult biology
- operational definitions
- biology as evidence not specification
- appearance versus mechanism
- first-principles investigation
claim_targets:
- id: c01
  status: supported
  statement: Naming or implementing a biological concept does not establish that property.
- id: c02
  status: supported
  statement: Digital life should not be required in advance to reproduce biological architecture.
- id: c03
  status: supported
  statement: Life-like terms must be attached to operational evidence rather than visual resemblance.
evidence_targets:
- Examples showing why named software components do not constitute evidence.
- Operational descriptions of persistence, reproduction, learning, inheritance, and related
  properties.
scope_boundaries:
- The chapter does not define life.
- The listed biological properties are prompts for investigation, not a checklist of necessary
  conditions.
reader_state:
  leaves_with: The reader should stop asking whether a system looks alive and instead ask
    what measurable property has actually been demonstrated.
technical_progression: familiar biological vocabulary -> two specification traps -> operational
  discipline -> open research question
entity_requirements:
- biology
- artificial life
- operational criteria
diagnostic_notes:
- 'Book contribution: establishes the anti-checklist thesis that the rest of the book repeatedly
  applies.'
- 'Placement: foundational; later experimental refusals depend on this chapter''s distinction
  between names and earned properties.'
- 'MRI calibration: required beats are intentionally atomic and section-shaped.'
