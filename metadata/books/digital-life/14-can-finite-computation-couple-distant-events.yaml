claim_targets:
- A finite shared evaluation selector can causally couple distant regions despite
  a nearest-neighbour local rule.
- Removing the selector removes the measured outside-cone effect.
- The mechanism is routing/allocation of causal opportunity, not long-range payload
  transmission or demonstrated amplification.
evidence_targets:
- Frozen-state budget-fraction intervention.
- Full-evaluation controls.
- Matched-process consequence analysis.
scope_boundaries:
- The local transition rule remains local.
- The result does not establish signalling, payload transmission, or amplification.
- Mean long-horizon consequence is not shown to change meaningfully at the declared
  scale.
reader_state: The reader should recognize finite computational opportunity as a global
  causal constraint capable of rerouting local effects without nonlocal physics.
