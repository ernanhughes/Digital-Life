document_id: 09-can-experience-change-the-material
document_type: chapter
title: Can Experience Change the Material?
profile: technical
metadata_status: working
metadata_version: 1
metadata_confidence: 0.97
chapter_mode: experimental
purpose: Test whether an experienced event can leave a persistent material modification
  that remains causally accessible and can later alter construction, while separating
  persistence, accessibility, distinguishability, and functional response.
required_beats:
- id: m01
  fulfilled: true
  description: Add the smallest persistent material distinction rather than an explicit
    memory subsystem.
- id: m02
  fulfilled: true
  description: Establish that the modification persists but can cease to matter once
    it leaves the causal aperture.
- id: m03
  fulfilled: true
  description: Separate storage from causal access.
- id: m04
  fulfilled: true
  description: Close the causal chain from experienced state to changed attachment
    behaviour.
- id: m05
  fulfilled: true
  description: Test mechanisms for keeping the trace near the active interface.
- id: m06
  fulfilled: true
  description: Separate amount of modified material from placement and show placement
    changes causal lifetime.
- id: m07
  fulfilled: true
  description: Test whether different pasts remain distinguishable under a decoder
    and then remove decoder-dependent interpretation.
- id: m08
  fulfilled: true
  description: Conclude with a reachable past while refusing memory or functional-use
    claims that the tests did not earn.
concept_targets:
- persistent material state
- causal accessibility
- active interface
- storage versus access
- placement
- history discrimination
claim_targets:
- A persistent trace can exist while no longer being causally accessible.
- Placement of stored material changes how long it can influence later construction.
- Distinguishable traces do not by themselves establish a different functional response
  or memory.
evidence_targets:
- Label-retention/erasure ablation.
- Placement-controlled material experiments.
- Decoder and decoder-free comparisons of different histories.
scope_boundaries:
- Persistence is partly by construction and is not itself a discovery.
- The mechanism does not establish readable memory, learning, semantics, or endogenous
  history encoding.
reader_state: The reader should understand that information must be both present and
  causally reachable, and that even reachable traces need not constitute memory.
technical_progression: write trace -> persistence -> loss of access -> causal chain
  -> keep trace near interface -> placement experiment -> distinguishability test
  -> narrowed reachable-past result
entity_requirements:
- modified cells
- causal aperture
- active interface
- history traces
diagnostic_notes:
- 'Book contribution: introduces causal accessibility as a central concept and shows
  why storage alone is too weak.'
- 'Placement: bridges the state/history chapter to later turnover and hidden-state
  causal-sensitivity experiments.'
