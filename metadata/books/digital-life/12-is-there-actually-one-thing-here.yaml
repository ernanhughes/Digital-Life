- id: m09
  fulfilled: true
  description: Preserve the narrower same-side localization result.
- id: m10
  fulfilled: true
  description: Bound the interpretation by distinguishing locality from individuality.
- id: m11
  fulfilled: true
  description: Look backward from events to separate stored bulk from active flux.
- id: m12
  fulfilled: true
  description: Reframe the crystal as bulk plus dynamically generated interface rather than
