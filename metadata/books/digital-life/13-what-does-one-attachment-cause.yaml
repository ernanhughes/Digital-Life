document_id: 13-what-does-one-attachment-cause
document_type: chapter
title: What Does One Attachment Cause?
profile: technical
metadata_status: working
metadata_version: 1
metadata_confidence: 0.96
chapter_mode: experimental
purpose: Abandon object-first analysis and isolate the causal consequences of one
  attachment, separating apparent propagation, immediate mechanical effects, cumulative
  consequences, geometry, and predictor claims.
required_beats:
- id: m01
  fulfilled: true
  description: Start from one event rather than a predeclared object or region.
- id: m02
  fulfilled: true
  description: Test and reject a propagation claim after showing that the estimator
    can manufacture a wave-like pattern.
- id: m03
  fulfilled: true
  description: Recover the signed local structure suppressed by the positive-only
    estimator.
- id: m04
  fulfilled: true
  description: Force one attachment and verify the immediate effect against the local
    rule's mechanical prediction.
- id: m05
  fulfilled: true
  description: Compare retained, transient, and prevented interventions to separate
    causal claims.
- id: m06
  fulfilled: true
  description: Show that local geometry changes immediate opportunity differently.
- id: m07
  fulfilled: true
  description: Test whether local geometry predicts long-run causal gain and close
    the feature search when it does not.
- id: m08
  fulfilled: true
  description: Retain the measured causal effects while refusing unsupported propagation
    and stable-local-predictor interpretations.
concept_targets:
- event-first causality
- estimator failure
- FORCE/PREVENT intervention
- immediate versus cumulative effect
- causal opportunity
- predictor failure
claim_targets:
- The initial propagation statistic failed and could manufacture the shape it sought.
- A forced attachment has an immediate causal effect consistent with the local mechanics.
- No stable local predictor of long-run causal gain was established under the tested
  feature searches.
evidence_targets:
- Distance-lag event field and controls.
- Corrected FORCE/PREVENT interventions.
- Geometry stratification and predictor attempts.
scope_boundaries:
- Suggestive secondary shapes do not rescue a failed primary propagation claim.
- Immediate causal effect does not imply durable amplification or organism-level function.
- Failed feature searches are not proof that no predictor exists.
reader_state: The reader should understand that causal analysis must distinguish what
  happens immediately from what accumulates later and must audit the estimator itself.
technical_progression: event field -> failed propagation -> estimator diagnosis ->
  direct intervention -> causal decomposition -> geometry -> predictor search -> bounded
  closeout
entity_requirements:
- attachment event
- FORCE
- PREVENT
- event field
- local geometry
diagnostic_notes:
- 'Book contribution: replaces body-first reasoning with event-first causal analysis.'
- 'Placement: produces the unexplained far-field effect that Chapter 14 is specifically
  designed to explain.'
