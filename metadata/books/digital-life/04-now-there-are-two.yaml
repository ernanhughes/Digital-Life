concept_targets:
- causal reproduction
- branching ancestry
- recurrence versus descent
- emergent organization
- Outlier
claim_targets:
- Reproduction requires a causal descent relation, not visual copying alone.
- Outlier contains reproduction-like organization that survives the stated causal
  ancestry criterion.
- The result does not establish an organism, population, or life.
evidence_targets:
- Causal graph/reconstruction connecting earlier organization to later copies.
- Controls separating structural recurrence from independent appearance.
scope_boundaries:
