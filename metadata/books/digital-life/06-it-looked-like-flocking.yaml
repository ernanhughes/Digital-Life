document_id: 06-it-looked-like-flocking
document_type: chapter
title: It Looked Like Flocking
profile: technical
metadata_status: working
metadata_version: 2
metadata_confidence: 0.94
chapter_mode: experimental
purpose: Investigate apparent flocking in Outlier by separating measured short-range directional
  coherence from proposed explanations such as global expansion and shared ancestry, then
  narrow the result to what can be supported under matched comparisons.
required_beats:
- id: m01
  fulfilled: true
  description: Turn the visual flocking observation into a measurable directional-coherence
    question.
- id: m02
  fulfilled: true
  description: Show an initial short-range alignment effect relative to a shuffled comparison.
- id: m03
  fulfilled: true
  description: Test whether global radial expansion explains the effect and retain only what
    is not explained by expansion.
- id: m04
  fulfilled: true
  description: Introduce shared ancestry as a plausible alternative explanation for local
    coherence.
- id: m05
  fulfilled: true
  description: Report the exciting ancestry-related result before auditing whether the comparison
    was valid.
- id: m06
  fulfilled: true
  description: Identify the original control as invalid because the compared cases differed
    in support.
- id: m07
  fulfilled: true
  description: Repair the comparison and preserve the effect that survives the corrected control.
- id: m08
  fulfilled: true
  description: Expose the four-and-a-half-cell problem as a locality/support constraint on
    interpretation.
- id: m09
  fulfilled: true
  description: Construct like-with-like comparisons rather than extrapolating across unsupported
    regions.
- id: m10
  fulfilled: true
  description: Limit conclusions to the region where common support makes comparison possible.
- id: m11
  fulfilled: true
  description: Show the remaining within-support effect while keeping its scope narrow.
- id: m12
  fulfilled: true
  description: State what the analysis still cannot answer about mechanism or biological flocking.
- id: m13
  fulfilled: true
  description: Reject flocking as an established interpretation while retaining directional
    coherence as real.
- id: m14
  fulfilled: true
  description: Preserve the phenomenon after the preferred explanation weakens.
- id: m15
  fulfilled: true
  description: Carry forward the methodological lesson that the comparison must be built before
    the biological label.
concept_targets:
- directional coherence
- radial confounding
- causal ancestry
- matching
- common support
- flocking interpretation
claim_targets:
- id: c01
  status: supported
  statement: Nearby persistent structures show real short-range directional coherence.
- id: c02
  status: supported
  statement: Global radial expansion alone does not explain the measured coherence.
- id: c03
  status: supported
  statement: The evidence does not establish flocking as the correct biological interpretation.
evidence_targets:
- Velocity-shuffled control.
- Radial-subtracted analysis.
- Matched ancestry comparisons within common support.
scope_boundaries:
- Directional alignment is a measurement; flocking is an interpretation.
- Unsupported regions of the data should not be used to infer ancestry effects.
reader_state:
  leaves_with: The reader should see how a striking phenomenon can remain real while its first
    explanation is progressively weakened.
technical_progression: visual flocking -> measured coherence -> expansion control -> ancestry
  hypothesis -> control correction -> matched estimate -> narrowed conclusion
entity_requirements:
- Outlier
- motion tracks
- causal families
- common support
