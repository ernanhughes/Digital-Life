document_id: 10-what-survives-material-loss
document_type: chapter
title: What Survives Material Loss?
profile: technical
metadata_status: working
metadata_version: 1
metadata_confidence: 0.97
chapter_mode: experimental
purpose: Remove irreversible material persistence and discover how ordinary local
  growth behaves under ongoing loss, revealing that loss creates new construction
  interfaces, extensive turnover can coexist with continued growth, and reoccupation
  must not be mislabeled repair.
required_beats:
- id: m01
  fulfilled: true
  description: Introduce OCCUPIED to EMPTY transitions without adding repair, maintenance,
    or target state.
- id: m02
  fulfilled: true
  description: Predeclare and test the plausible finite-sustainable-size prediction.
- id: m03
  fulfilled: true
  description: Show that the finite-size prediction fails across the tested loss sweep.
- id: m04
  fulfilled: true
  description: Discover that gross construction rises sharply with material loss.
- id: m05
  fulfilled: true
  description: 'Identify the mechanism: loss creates interior frontier and construction
    opportunity.'
- id: m06
  fulfilled: true
  description: Show that the active interface is not identical to the outer edge.
- id: m07
  fulfilled: true
  description: Measure rapid, frequent reoccupation while refusing to call it repair.
- id: m08
  fulfilled: true
  description: Reframe population as a poor summary of a high-throughput turnover
    process.
concept_targets:
- material turnover
- loss-created frontier
- active interface
- reoccupation
- gross versus net flow
- repair boundary
claim_targets:
- No tested loss rate produced the predeclared finite stationary regime.
- Loss manufactures new construction opportunities and strongly increases gross construction.
- Large turnover and reoccupation can occur without an explicit repair mechanism.
evidence_targets:
- Loss-rate sweep with predeclared gates.
- Gross attachments/losses/net accounting.
- Reoccupation timing and counts.
scope_boundaries:
- Reoccupation is not repair.
- Continued growth under loss is not self-maintenance or metabolism.
- Failure of the tested finite-size prediction does not rule out other stationary
  regimes.
reader_state: The reader should see the crystal as a dynamic flow of material-changing
  events rather than a persistent stock of cells.
technical_progression: introduce loss -> plausible equilibrium prediction -> failure
  -> gross-flow anomaly -> frontier mechanism -> reoccupation -> turnover without
  repair
entity_requirements:
- loss probability
- construction interface
- reoccupation
- gross construction
diagnostic_notes:
- 'Book contribution: breaks the fixed-material assumption and makes process continuity
  concrete.'
- 'Placement: prerequisite for finite-budget scarcity and later arguments about boundaries,
  turnover, and process-first organization.'
