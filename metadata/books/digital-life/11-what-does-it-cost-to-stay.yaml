document_id: 11-what-does-it-cost-to-stay
document_type: chapter
title: What Does It Cost to Stay?
profile: technical
metadata_status: working
metadata_version: 2
metadata_confidence: 0.95
chapter_mode: experimental
purpose: Introduce finite computational opportunity as scarcity, test how evaluation budgets
  and scheduling rules shape growth and reoccupation, and distinguish stable-looking population
  from stable underlying flow.
required_beats:
- id: m01
  fulfilled: true
  description: Introduce finite evaluation by noting that not every eligible transition gets
    evaluated.
- id: m02
  fulfilled: true
  description: Show that a binding budget constrains the population reached within the tested
    horizon.
- id: m03
  fulfilled: true
  description: Explain scarcity as allocation among candidate transitions rather than biological
    energy.
- id: m04
  fulfilled: true
  description: Compare three allocation policies under the same nominal budget.
- id: m05
  fulfilled: true
  description: Show that the same budget can produce different futures depending on scheduling.
- id: m06
  fulfilled: true
  description: Preserve the negative result when the predicted reuse-versus-expansion tradeoff
    fails under the initial comparison.
- id: m07
  fulfilled: true
  description: Ask whether the system can simply stay at a stable population under finite
    budget and loss.
- id: m08
  fulfilled: true
  description: Show the near-stationary case while keeping it bounded as almost stable.
- id: m09
  fulfilled: true
  description: Distinguish stable-looking stock from continuing high turnover flow.
- id: m10
  fulfilled: true
  description: Compare small and large starts to test whether aggregate stability depends
    on initial scale.
- id: m11
  fulfilled: true
  description: Show that aggregate population barely moves under the tested normalization.
- id: m12
  fulfilled: true
  description: Show that expansion breaks the apparent reuse pattern.
- id: m13
  fulfilled: true
  description: Separate reuse and expansion responses after normalization.
- id: m14
  fulfilled: true
  description: Conclude that staying has a computational-opportunity cost without equating
    budget to metabolism.
- id: m15
  fulfilled: true
  description: 'Summarize the three tests that survive: constrained reach, allocation, and
    stock/flow distinction.'
concept_targets:
- finite evaluation budget
- computational scarcity
- allocation
- scheduling
- stable stock versus flow
- transition opportunity
claim_targets:
- id: c01
  status: supported
  statement: Finite evaluation opportunity constrains the population reached within the tested
    horizon.
- id: c02
  status: supported
  statement: When the budget binds, eligible transitions compete for computational opportunity.
- id: c03
  status: supported
  statement: Similar aggregate population can hide materially different process flows.
evidence_targets:
- Budget sweep.
- Equal-budget scheduling-policy comparison.
- Stationary-population and normalized-flow analyses.
scope_boundaries:
- The budget is not energy or metabolism.
- The experiments do not establish an asymptotic carrying capacity.
- Support-biased scheduling is not a clean independent test of reuse versus expansion.
