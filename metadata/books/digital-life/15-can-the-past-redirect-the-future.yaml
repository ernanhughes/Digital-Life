- id: m01
  fulfilled: true
  description: 'State the narrower question: same visible geometry, different hidden
    material state, same perturbation.'
- id: m02
  fulfilled: true
  description: Introduce a weak decaying hidden scalar that changes ordinary attachment
    score.
- id: m03
  fulfilled: true
  description: Compare accessible, remote, and erased hidden-state placements with
    visible occupancy matched.
- id: m04
  fulfilled: true
  description: Invalidate the first experiment when PREVENT fails to prevent the focal
    attachment.
- id: m05
  fulfilled: true
  description: Repair the intervention rather than rescuing the original downstream
    claim.
- id: m06
  fulfilled: true
  description: Replicate the immediate hidden-state-dependent causal response.
- id: m07
  fulfilled: true
  description: Track later trajectory divergence and distinguish direction, magnitude,
    and descriptive closeout.
- id: m08
  fulfilled: true
  description: Conclude with hidden-state-conditioned causal response while explicitly
    refusing memory or endogenous history encoding.
concept_targets:
- hidden material state
- causal sensitivity
- matched visible geometry
- intervention validity
- trajectory redirection
- memory boundary
claim_targets:
- Same visible occupancy can respond differently because complete hidden state differs.
- Accessible hidden material changes immediate causal response relative to matched
  remote material under the corrected intervention.
- Later trajectory divergence is consistent with redirection but does not establish
  memory or endogenous history encoding.
evidence_targets:
- Accessible/remote/erased matched-state experiment.
- Intervention audit and corrected FORCE/PREVENT design.
- Immediate causal response and later trajectory analyses.
scope_boundaries:
- The hidden state is written experimentally, not generated by the crystal's own history.
- The result establishes causal sufficiency, not readable memory, learning, or self-conditioning.
- Invalid downstream results from the broken intervention must not be treated as negative
  or positive evidence.
reader_state: The reader should understand that hidden state can change future response
  without being a record that the system reads, and should see invalidation as part
  of the result.
technical_progression: hidden-state hypothesis -> matched visible present -> flawed
  intervention -> invalidation -> correction -> immediate replication -> trajectory
  closeout -> memory refusal
