chapter_mode: method_experiment
purpose: Calibrate the book's evidence by constructing a deliberately simple decoy
  system and showing that several apparently discriminating persistence and organization
  tests are too easy to pass.
required_beats:
- id: m01
  fulfilled: true
  description: Explain why a positive result increases the need to test the measuring
    instrument itself.
- id: m02
  fulfilled: true
  description: Construct a simple friend/enemy particle swarm as an adversarial calibration
    system.
- id: m03
  fulfilled: true
  description: Test material, organizational, and identity-label interventions.
- id: m04
  fulfilled: true
  description: Discover that return to one privileged picture is a broken persistence
    definition.
- id: m05
  fulfilled: true
  description: Replace picture recovery with regime-relative measurement against ordinary
    variation.
- id: m06
  fulfilled: true
  description: Show that severe interventions and graph replacement can still satisfy
    cheap persistence/organization measures.
- id: m07
  fulfilled: true
  description: Conclude that the tests, not the swarm, were the primary object learned
    about.
concept_targets:
- adversarial calibration
- negative-control logic
- ordinary variation
- measurement validity
- regime persistence
claim_targets:
- A deliberately simple decoy can expose evidence that is too easy to satisfy.
- Persistence should not be defined as return to one preferred picture when the untouched
  control itself moves.
- Some seemingly strong organization measures are not discriminating evidence for
  digital life.
evidence_targets:
- Four-branch intervention design.
- Longer control runs showing natural movement away from the reference configuration.
- Graph-replacement and damage sweeps.
scope_boundaries:
- The swarm is not proven nonliving.
- Passing or failing these tests says more about the tests than about life.
reader_state: The reader should treat every later metric as an instrument that itself
  needs controls.
technical_progression: positive-result overconfidence risk -> decoy -> intervention
  tests -> broken metric -> improved baseline -> limits of discrimination
entity_requirements:
- friend/enemy particle swarm
- ordinary variation
- control branch
diagnostic_notes:
- 'Book contribution: installs adversarial calibration as a recurring method and prevents
  later chapters from inheriting unearned confidence.'
- 'Placement: essential bridge from early positive Outlier result to the more disciplined
  experiments that follow.'
