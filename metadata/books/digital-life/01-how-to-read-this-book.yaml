document_id: 01-how-to-read-this-book
document_type: chapter
title: How to Read This Book
profile: technical
metadata_status: working
metadata_version: 1
metadata_confidence: 0.96
chapter_mode: method
purpose: 'Teach the reader how to evaluate the book''s argument: distinguish observation
  from interpretation, follow claims back to evidence, treat controls and failures
  as part of the result, and keep conclusions bounded by what the experiments actually
  establish.'
required_beats:
- id: m01
  fulfilled: true
  description: 'Establish the book''s three reading depths: argument, evidence, and
    experimental audit.'
- id: m02
  fulfilled: true
  description: Define the recurring investigation loop from observation through hypothesis,
    measurement, attack, control, and survivor.
- id: m03
  fulfilled: true
  description: Teach that an observation may survive after its preferred interpretation
    fails.
- id: m04
  fulfilled: true
  description: Explain what controls do and why claims need explicit edges and scope.
- id: m05
  fulfilled: true
  description: Establish that failed experiments and corrections remain evidence rather
    than material to hide.
- id: m06
  fulfilled: true
  description: Make the experimental record authoritative over attractive prose or
    interpretation.
concept_targets:
- observation versus interpretation
- controls
- claim boundaries
- experimental provenance
- failure as evidence
claim_targets:
- Major conceptual claims should have an inspectable trail toward evidence.
- Controls test interpretations rather than merely decorate experiments.
- A failed interpretation can leave a valid lower-level observation intact.
evidence_targets:
- Worked examples of biological language being narrowed by controls.
- Explicit reading path from prose to repository and experimental record.
scope_boundaries:
- This chapter defines the book's method; it does not establish any property of digital
  life.
- The method does not guarantee that every chosen measurement or null is correct.
reader_state: The reader should know how to read later chapters skeptically, what
  kinds of evidence to look for, and why the book repeatedly narrows its own conclusions.
technical_progression: reading instructions -> experimental method -> controls and
  claim boundaries -> failure/correction policy -> invitation to audit
entity_requirements:
- Digital Life web edition
- Digital Life source repository
- experimental record
diagnostic_notes:
- 'Book contribution: establishes the epistemic contract used by every later chapter.'
- 'Placement: must precede the scientific argument because later chapters assume this
  vocabulary of evidence, controls, and bounded claims.'
