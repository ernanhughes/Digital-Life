{{ define "main" }}
<section class="page-section about-page">
  <div class="about-container">
    <header class="about-header">
      <h1>{{ .Title }}</h1>
      {{ with .Params.description }}
        <p class="about-description">{{ . }}</p>
      {{ end }}
    </header>

    <div class="about-content">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
