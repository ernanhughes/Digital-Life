<style>
    .paper-badge {
        position: absolute;
        top: 1rem;
        right: 1rem;
        text-align: right;
        font-size: 0.8rem;
        z-index: 10;
    }Ok so when I add the papers

    .paper-badge a {

        background: #f4f4f4;
        border: 1px solid #ccc;
        border-radius: 4px;

        color: #333;

    .paper-badge a:hover {

<div class="paper-badge">
    {{ range .Params.papers }}
    <a href="{{ .url }}" target="_blank">
        📄 {{ .title }} ({{ .id }})
