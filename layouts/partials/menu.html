{{- if .Site.Menus.main }}
<nav class="menu" aria-label="Primary navigation">
  <button class="menu__btn" type="button" aria-expanded="false" aria-controls="site-menu">
    <span class="menu__btn-title">Menu</span>
  </button>
  <ul class="menu__list" id="site-menu">
    {{- $currentNode := . }}
    {{- range .Site.Menus.main }}
    <li class="menu__item{{ if or ($currentNode.IsMenuCurrent "main" .) ($currentNode.HasMenuCurrent "main" .) }} menu__item--active{{ end }}">
      <a class="menu__link" href="{{ .URL }}">
        {{- with .Pre }}{{ . }}{{ end -}}
        <span class="menu__text">{{ .Name }}</span>
        {{- with .Post }}{{ . }}{{ end -}}
      </a>
    </li>
    {{- end }}
  </ul>
</nav>
{{- else }}
<div class="divider"></div>
{{- end }}
