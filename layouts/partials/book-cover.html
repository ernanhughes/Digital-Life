{{- $book := .book -}}
{{- $size := default "full" .size -}}

{{- $coverURL := printf "/images/books/%s/cover.png" $book.id -}}
{{- $coverFile := printf "static%s" $coverURL -}}

{{- if fileExists $coverFile }}
  <div class="book-cover book-cover--{{ $size }}">
    <img
      src="{{ $coverURL | relURL }}"
      alt="{{ $book.title }} cover"
      loading="lazy"
    >
  </div>
{{- end }}
