{{- $book := .book -}}
{{- $size := default "full" .size -}}
{{- $coverURL := partial "book-cover-path.html" $book -}}

{{- if $coverURL -}}
  <div class="book-cover book-cover--{{ $size }}">
    <img
      src="{{ $coverURL | relURL }}"
      alt="{{ $book.Title }} cover"
      loading="lazy"
    >
  </div>
{{- end -}}
